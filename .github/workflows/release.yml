name: Build XPI Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build XPI
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Prepare release artifact
        run: |
          mkdir -p dist
          cp .scaffold/build/show-markdown.xpi "dist/show-markdown-${GITHUB_REF_NAME}.xpi"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: show-markdown-xpi
          path: dist/*.xpi

      - name: Upload XPI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.xpi
          generate_release_notes: true
